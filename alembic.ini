# Configuração do Alembic (ferramenta de migrations) para um único banco de dados.

[alembic]
# Caminho da pasta com os scripts de migration.
# Normalmente em formato POSIX (barras "/"), relativo a %(here)s,
# que representa a pasta onde este arquivo .ini está.
script_location = %(here)s/alembic

# Modelo usado para gerar o nome dos arquivos de migration (padrão: %%(rev)s_%%(slug)s).
# Aqui o nome começa com data e hora, para que as migrations fiquem em ordem cronológica.
# Tokens disponíveis: https://alembic.sqlalchemy.org/en/latest/tutorial.html#editing-the-ini-file
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
# Alternativa: organizar em subpastas por data (exige recursive_version_locations = true)
# file_template = %%(year)d/%%(month).2d/%%(day).2d_%%(hour).2d%%(minute).2d_%%(second).2d_%%(rev)s_%%(slug)s

# Caminho adicionado ao início do sys.path. Com "." o pacote "app" pode ser
# importado pelo alembic/env.py quando o comando é executado na raiz do projeto.
# Para vários caminhos, o separador é definido em "path_separator" abaixo.
prepend_sys_path = .

# Fuso horário usado na data dentro do arquivo de migration e no nome do arquivo.
# Se definido, exige a biblioteca tzdata (instalável com `alembic[tz]`).
# O valor é repassado para ZoneInfo(); em branco = horário local.
# timezone =

# Tamanho máximo do campo "slug" (descrição) no nome do arquivo.
# truncate_slug_length = 40

# 'true' para executar o env.py também no comando 'revision', mesmo sem autogenerate.
# revision_environment = false

# 'true' para aceitar arquivos .pyc/.pyo sem o .py correspondente como migrations.
# sourceless = false

# Local(is) das migrations. Padrão: <script_location>/versions.
# Com várias pastas, as migrations iniciais precisam de --version-path.
# version_locations = %(here)s/bar:%(here)s/bat:%(here)s/alembic/versions

# Caractere que separa listas de caminhos (version_locations e prepend_sys_path).
# Valores válidos: ":", ";", "space", "newline" ou "os".
# "os" usa o separador do sistema operacional (os.pathsep) — padrão para projetos novos.
path_separator = os

# 'true' para buscar migrations recursivamente nas pastas de "version_locations".
# recursive_version_locations = false

# Codificação usada ao gravar os arquivos de migration gerados a partir de script.py.mako.
# output_encoding = utf-8

# URL do banco de dados.
# Ela NÃO é definida aqui: o alembic/env.py lê DATABASE_URL do .env
# (mesma configuração usada pela aplicação), evitando duplicidade.
# sqlalchemy.url =


[post_write_hooks]
# Scripts ou funções executados sobre cada migration recém-gerada
# (ex.: formatadores e linters). Nenhum está ativo neste projeto.

# Formatar com "black":
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 79 REVISION_SCRIPT_FILENAME

# Corrigir com "ruff":
# hooks = ruff
# ruff.type = module
# ruff.module = ruff
# ruff.options = check --fix REVISION_SCRIPT_FILENAME

# Configuração de logs exibidos ao executar os comandos do Alembic.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
